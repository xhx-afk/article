# DEIM HGNetv2-Medium 在 COCO 上的训练配置。
# 在 D-FINE Medium 规格基础上启用 DEIM 的增强、调度和损失覆盖。
__include__: [
  # Medium 规格 D-FINE 基础配置。
  './dfine_hgnetv2_m_coco.yml',
  # DEIM 专用覆盖配置。
  '../base/deim.yml'
]

# 当前 DEIM Medium 实验输出目录。
output_dir: ./outputs/deim_hgnetv2_m_coco

optimizer:
  type: AdamW
  params: 
    -
      # Medium 主干较大，backbone 非 bn 参数使用更小学习率。
      params: '^(?=.*backbone)(?!.*bn).*$'
      lr: 0.00004
    - 
      # norm/bn 参数不做 weight decay，避免归一化参数被过度正则化。
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  # 默认学习率，主要用于 encoder/decoder 主体参数。
  lr: 0.0004
  betas: [0.9, 0.999]
  weight_decay: 0.0001


# 总训练轮数；90 轮后继续训练 12 轮，用于无强增广后期收敛和 EMA 搜索。
epoches: 102 # 90 + 12

# DEIM flatcosine 学习率调度覆盖。
flat_epoch: 49    # 经验设置：4 + 90 / 2 = 49。
# 最后 12 个 epoch 关闭强增广。
no_aug_epoch: 12

# DEIM 数据增强阶段覆盖。
train_dataloader: 
  dataset: 
    transforms:
      policy:
        # 第 4、49、90 个 epoch 是增强策略的关键阶段节点。
        epoch: [4, 49, 90]   # 阶段节点列表。

  collate_fn:
    # MixUp 在前两个阶段内启用。
    mixup_epochs: [4, 49]
    # 第 90 个 epoch 后停止多尺度/强混合增强。
    stop_epoch: 90
