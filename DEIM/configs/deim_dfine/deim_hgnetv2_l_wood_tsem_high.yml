# DEIM-L Wood + TSEM high_only 消融配置。
# 继承 baseline，只覆盖 output_dir 和 TSEM 字段，保证公平对比。

__include__:
  - "./deim_hgnetv2_l_wood.yml"

output_dir: ./deim_outputs/deim_hgnetv2_l_wood_tsem_high_960

HybridEncoder:
  use_tsem: true
  tsem_mode: high_only
  tsem_levels: [0, 1]
  tsem_smooth_kernel: 5
  tsem_dilations: [1, 2, 3]
  tsem_reduction: 16
  tsem_init_scale: 0.0
  tsem_learnable_smoothing: true
  tsem_debug: false
