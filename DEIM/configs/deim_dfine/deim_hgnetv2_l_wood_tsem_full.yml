# DEIM-L Wood + TSEM full 配置。

__include__:
  - "./deim_hgnetv2_l_wood.yml"

output_dir: ./deim_outputs/deim_hgnetv2_l_wood_tsem_full_960

HybridEncoder:
  use_tsem: true
  tsem_mode: full
  tsem_levels: [0, 1, 2]
  tsem_smooth_kernel: 5
  tsem_dilations: [1, 2, 3]
  tsem_reduction: 16
  tsem_init_scale: 0.0
  tsem_learnable_smoothing: true
  tsem_debug: false
