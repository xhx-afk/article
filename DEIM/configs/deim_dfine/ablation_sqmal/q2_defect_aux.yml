# Q2：Q1 + 高分辨率特征上的二值缺陷度辅助监督，仍使用原 MAL。
__include__: ["./q1_quality.yml"]

output_dir: ./output/sqmal/q2_defect_aux

DEIM:
  use_defectness_head: true
  defectness_in_channels: 256
  defectness_hidden_channels: 128
  return_defect_map_in_eval: false

DEIMCriterion:
  losses: ["mal", "boxes", "local", "quality", "defect"]
  defect_bce_weight: 1.0
  defect_dice_weight: 1.0
  weight_dict:
    loss_defect: 0.5

