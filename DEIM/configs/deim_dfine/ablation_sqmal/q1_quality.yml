# Q1：Q0 + query quality head + quality loss + top-k 前质量重排。
__include__: ["./q0_baseline.yml"]

output_dir: ./output/sqmal/q1_quality

DFINETransformer:
  use_quality_head: true
  quality_hidden_dim: 128
  # 第一版只监督最后一层，避免 decoder aux 显存增长。
  quality_aux_last_n: 0

DEIMCriterion:
  losses: ["mal", "boxes", "local", "quality"]
  quality_pos_weight: 1.0
  quality_neg_weight: 0.25
  weight_dict:
    loss_quality: 0.5

PostProcessor:
  quality_rerank: true
  quality_power: 0.5

