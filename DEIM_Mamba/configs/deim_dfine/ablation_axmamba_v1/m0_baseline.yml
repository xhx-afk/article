# AxMamba V1 消融实验 M0：原始基线。
#
# 实验目的：
#   1. 完全关闭 AxMamba，保持原 DEIM-D-FINE-L 木材缺陷检测模型；
#   2. 作为 M1/M2/M3 的统一对照组；
#   3. 用于检查新增代码在关闭状态下是否与原基线严格一致。
#
# 本文件只覆盖输出目录和 AxMamba 开关。数据集路径、输入尺寸、训练轮数、
# 数据增强、优化器、HGNetv2、Transformer 编码器、D-FINE 解码器、损失函数
# 等参数全部继承自现有木材基线，避免消融实验出现无关配置漂移。
__include__:
  # 当前项目中已经用于训练的 DEIM-D-FINE-L 木材数据集基线配置。
  - ../deim_hgnetv2_l_wood.yml

# M0 使用独立输出目录，防止覆盖原基线或其他 AxMamba 消融实验的权重和日志。
output_dir: ./deim_outputs/deim_hgnetv2_l_wood_axmamba_m0

HybridEncoder:
  # 关闭 AxMamba。
  # 关闭时 HybridEncoder 不创建 axmamba_blocks，也不会新增 AxMamba 参数；
  # input_proj 之后直接进入原 Transformer encoder、FPN 和 PAN 路径。
  use_axmamba: false

# =============================================================================
# M0 服务器执行命令（复制时去掉每行开头的 “# ”）
# =============================================================================
# 以下训练参数直接继承 ../deim_hgnetv2_l_wood.yml：
#   quick_balanced_4000 训练集/验证集、960×960、25 epochs、worker=4；
#   train/val 全局 batch 均为 8，单卡每卡 8，双卡每卡 4。
# YAML 输出目录：
#   /home/zxw4090/hjw/D-FINE/deim_outputs/deim_hgnetv2_l_wood_axmamba_m0
#
# 阶段 1：单卡正式训练（从 COCO 预训练权重微调）
# cd /home/zxw4090/hjw/D-FINE
# CUDA_VISIBLE_DEVICES=0 python /home/zxw4090/hjw/D-FINE/train.py \
#   -c /home/zxw4090/hjw/D-FINE/configs/deim_dfine/ablation_axmamba_v1/m0_baseline.yml \
