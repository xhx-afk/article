# AxMamba V1 消融实验 M3：双向轴向 Mamba + local 空间方向门控。
#
# 这是 AxMamba V1 的完整版本。模块同时计算水平、垂直和局部特征，并在
# 每个空间位置预测三个 softmax 权重，使网络可以根据缺陷的横向、纵向或
# 局部纹理结构，自适应选择信息路径。
#
# 本配置需要安装与服务器 PyTorch/CUDA 兼容的官方 mamba_ssm。
# 数据、增强、输入分辨率、backbone、decoder、matcher 和 loss 不做改动。
__include__:
  # 继承当前可训练的 DEIM-D-FINE-L 木材基线配置。
  - ../deim_hgnetv2_l_wood.yml

# M3 独立输出目录，避免覆盖其他消融组的日志、权重和评估结果。
output_dir: ./deim_outputs/deim_hgnetv2_l_wood_axmamba_m3_axis_gate

HybridEncoder:
  # 启用 AxMamba 完整三分支结构。
  use_axmamba: true

  # 只增强 P4/P5：
  #   level 0 -> P3，stride=8，不处理；
  #   level 1 -> P4，stride=16，处理；
  #   level 2 -> P5，stride=32，处理。
  axmamba_levels: [1, 2]

  # axis_gate 使用水平 Mamba、垂直 Mamba、local 三个分支，并通过
  # 逐像素 softmax 门控进行融合。三个权重在每个像素位置之和恒为 1。
  axmamba_mode: axis_gate

  # 官方 Mamba 的状态空间隐状态维度。
  axmamba_d_state: 16

  # 官方 Mamba 内部一维局部卷积的卷积核大小。
  axmamba_d_conv: 4

  # 官方 Mamba 内部通道扩张倍率。
  axmamba_expand: 2

  # 门控网络的通道压缩倍率。输入为原特征 x 与 local 特征的拼接，
  # 即 2C -> max(C/4, 16) -> 3，最后对三个通道执行 softmax。
  axmamba_gate_reduction: 4

  # LayerScale gamma 初始值。使用 0.001 保证完整模块从近似恒等映射开始。
  axmamba_gamma_init: 0.001

  # 首轮实验关闭随机深度，保证与 M1/M2 的消融条件一致。
  axmamba_drop_path: 0.0

  # 是否在每次 forward 后保留门控均值、gamma 均值和三个分支的 RMS 范数。
  # 正式训练默认关闭，避免额外的张量保存和显存占用；调试时可临时设为 true，
  # 并通过 HybridEncoder.get_axmamba_debug_state() 读取最近一次统计。
  axmamba_collect_debug: false

# =============================================================================
