# AxMamba V1 消融实验 M1：仅局部多核卷积分支。
#
# 实验目的：单独评估局部纹理与边缘增强带来的收益，排除 Mamba 轴向扫描
# 和方向门控的影响。该配置不会创建任何 Mamba 实例，因此没有安装
# mamba_ssm 时也可以构建、训练和推理。
#
# 除下方 AxMamba 参数和独立输出目录外，其余数据、增强、分辨率、优化器、
# backbone、decoder、matcher 和 loss 均继承木材基线，保证消融公平。
__include__:
  # 继承当前可训练的 DEIM-D-FINE-L 木材基线配置。
  - ../deim_hgnetv2_l_wood.yml

# M1 独立保存日志、检查点和评估结果，不覆盖 M0/M2/M3。
output_dir: ./deim_outputs/deim_hgnetv2_l_wood_axmamba_m1_local

HybridEncoder:
  # 启用 AxMamba 框架；具体只激活 local 分支。
  use_axmamba: true

  # HybridEncoder 接收三个尺度，索引与特征层对应关系为：
  #   0 -> P3，stride=8，保持原样；
  #   1 -> P4，stride=16，加入局部增强；
  #   2 -> P5，stride=32，加入局部增强。
  # 因此 [1, 2] 表示只处理 P4/P5，不改变高分辨率 P3。
  axmamba_levels: [1, 2]

  # local 模式仅使用并行 DWConv 3x3 和 DWConv 5x5 分支：
  # 两个深度卷积结果求和后，经过 BN、SiLU、1x1 Conv 和输出 BN。
  # 不创建水平/垂直 Mamba，也不创建三分支方向门控网络。
  axmamba_mode: local

  # LayerScale 残差系数 gamma 的初始值。
  # 0.001 使模块从接近恒等映射开始训练，同时保留非零梯度通路；
  # 不建议初始化为严格的 0。
  axmamba_gamma_init: 0.001

  # 随机深度概率。首轮干净消融设为 0，表示不随机丢弃 AxMamba 残差分支。
  axmamba_drop_path: 0.0

# =============================================================================
