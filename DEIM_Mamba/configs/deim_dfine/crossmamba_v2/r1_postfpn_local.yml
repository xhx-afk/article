# CrossMamba V2 消融 R1：仅在第一次 top-down FPN 融合后的 fused P4 上启用 local anchor。
# 用于单独验证插入位置和局部多尺度锚点；不创建 Mamba 或 gate 参数。
#
# 字段说明：
#   use_crossmamba：总开关；true 时只创建 HybridEncoder.crossmamba_p4。
#   crossmamba_use_hv=false：关闭 H->V 交叉轴路径。
#   crossmamba_use_vh=false：关闭 V->H 交叉轴路径。
#   crossmamba_use_gate=false：关闭内容感知 sigmoid gate；R1 只有 local 残差。
#   crossmamba_gamma_local_init：local LayerScale 初值，1e-3 让新分支从小残差开始。
#   crossmamba_drop_path：随机深度概率；0 表示消融阶段不随机丢弃分支。
#   crossmamba_collect_debug：是否记录 gate/RMS/debug state；训练时默认关闭以节省开销。
__include__:
  - ../deim_hgnetv2_l_wood.yml

output_dir: ./deim_outputs/crossmamba_v2_r1_postfpn_local

HybridEncoder:
  use_crossmamba: true
  crossmamba_use_hv: false
  crossmamba_use_vh: false
  crossmamba_use_gate: false
  crossmamba_gamma_local_init: 0.001
  crossmamba_drop_path: 0.0
  crossmamba_collect_debug: false

# 训练命令：
# CUDA_VISIBLE_DEVICES=0,2 torchrun --master_port=7791 --nproc_per_node=2 train.py \
#   -c configs/deim_dfine/crossmamba_v2/r1_postfpn_local.yml \
#   -t /home/zxw4090/hjw/D-FINE/weight/deim_dfine_hgnetv2_l_coco_50e.pth \
#   --use-amp --seed=0
