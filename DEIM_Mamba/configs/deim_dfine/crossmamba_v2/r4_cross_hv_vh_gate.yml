# CrossMamba V2 消融 R4：local anchor + 双交叉轴路径 + 内容感知独立门控。
# HV/VH 分别使用 sigmoid gate；local 始终作为独立残差，不参与门控竞争。
#
# 字段说明：
#   crossmamba_gate_reduction：gate 压缩倍率；gate_dim=max(256/8,32)=32。
#   crossmamba_use_gate=true：启用两个相互独立的 sigmoid gate，输出范围为 [0,1]；
#                             两个 gate 不要求和为 1，也不包含 local 分支。
#   crossmamba_gate_bias_init=-2：sigmoid(-2)≈0.119，使 Mamba 初始只提供小增量。
#   crossmamba_gamma_local_init：local 分支 LayerScale 初值。
#   crossmamba_gamma_mamba_init：HV/VH 分支 LayerScale 初值。
#   crossmamba_collect_debug：开启后可由 get_crossmamba_debug_state() 读取 gate 分位数、
#                             分支 RMS 和 gamma 均值；正式训练建议 false。
__include__:
  - ../deim_hgnetv2_l_wood.yml

output_dir: ./deim_outputs/crossmamba_v2_r4_cross_hv_vh_gate

HybridEncoder:
  use_crossmamba: true
  crossmamba_d_state: 16
  crossmamba_d_conv: 4
  crossmamba_expand: 2
  crossmamba_gate_reduction: 8
  crossmamba_use_hv: true
  crossmamba_use_vh: true
  crossmamba_use_gate: true
  crossmamba_gamma_local_init: 0.001
  crossmamba_gamma_mamba_init: 0.001
  crossmamba_gate_bias_init: -2.0
  crossmamba_drop_path: 0.0
  crossmamba_collect_debug: false

# 训练命令：
# CUDA_VISIBLE_DEVICES=0,2 torchrun --master_port=7794 --nproc_per_node=2 train.py \
#   -c configs/deim_dfine/crossmamba_v2/r4_cross_hv_vh_gate.yml \
#   -t /home/zxw4090/hjw/D-FINE/weight/deim_dfine_hgnetv2_l_coco_50e.pth \
#   --use-amp --seed=0
