# CrossMamba V2 消融 R3：local anchor + H→V/V→H 双交叉轴路径。
# 两条 Mamba 增量都采用固定 residual（gate 恒为 1），不做 softmax 竞争。
#
# 字段说明：
#   crossmamba_use_hv=true：计算 HV=V(H(z))，其中 z 为共享 pre_norm(P4)。
#   crossmamba_use_vh=true：计算 VH=H(V(z))；HV/VH 复用同一 horizontal/vertical
#                           Mamba 模块，控制参数量，但两个轴使用不同参数。
#   crossmamba_use_gate=false：R3 是固定 residual 版本，不使用 sigmoid gate。
#   local 分支始终独立保留，不与 HV/VH 做三路 softmax 竞争。
__include__:
  - ../deim_hgnetv2_l_wood.yml

output_dir: ./deim_outputs/crossmamba_v2_r3_cross_hv_vh_mean

HybridEncoder:
  use_crossmamba: true
  crossmamba_d_state: 16
  crossmamba_d_conv: 4
  crossmamba_expand: 2
  crossmamba_use_hv: true
  crossmamba_use_vh: true
  crossmamba_use_gate: false
  crossmamba_gamma_local_init: 0.001
  crossmamba_gamma_mamba_init: 0.001
  crossmamba_drop_path: 0.0
  crossmamba_collect_debug: false

# 训练命令：
# CUDA_VISIBLE_DEVICES=0,2 torchrun --master_port=7793 --nproc_per_node=2 train.py \
#   -c configs/deim_dfine/crossmamba_v2/r3_cross_hv_vh_mean.yml \
#   -t /home/zxw4090/hjw/D-FINE/weight/deim_dfine_hgnetv2_l_coco_50e.pth \
#   --use-amp --seed=0
