# CrossMamba V2 消融 R2：local anchor + H→V 单条交叉轴路径。
# Mamba 增量采用固定 residual（gate 恒为 1），其余训练协议与 R1 相同。
#
# 字段说明：
#   crossmamba_d_state：Mamba 状态空间维度；16 为规范默认值。
#   crossmamba_d_conv：Mamba 局部卷积核宽度；4 为规范默认值。
#   crossmamba_expand：Mamba 内部通道扩展倍率；2 为规范默认值。
#   crossmamba_use_hv=true：启用 vertical(horizontal(pre_norm(P4)))。
#   crossmamba_use_vh=false：不启用反向 V->H 路径，便于隔离 H->V 效果。
#   crossmamba_use_gate=false：固定 gate=1，只由 gamma_mamba 控制增量。
#   crossmamba_gamma_mamba_init：HV 分支 LayerScale 初值，默认 1e-3。
__include__:
  - ../deim_hgnetv2_l_wood.yml

output_dir: ./deim_outputs/crossmamba_v2_r2_cross_hv_only

HybridEncoder:
  use_crossmamba: true
  crossmamba_d_state: 16
  crossmamba_d_conv: 4
  crossmamba_expand: 2
  crossmamba_use_hv: true
  crossmamba_use_vh: false
  crossmamba_use_gate: false
  crossmamba_gamma_local_init: 0.001
  crossmamba_gamma_mamba_init: 0.001
  crossmamba_drop_path: 0.0
  crossmamba_collect_debug: false

# 训练命令：
# CUDA_VISIBLE_DEVICES=0,2 torchrun --master_port=7792 --nproc_per_node=2 train.py \
#   -c configs/deim_dfine/crossmamba_v2/r2_cross_hv_only.yml \
#   -t /home/zxw4090/hjw/D-FINE/weight/deim_dfine_hgnetv2_l_coco_50e.pth \
#   --use-amp --seed=0
