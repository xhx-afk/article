# CrossMamba V2 消融 R0：原始 DEIM-D-FINE 木材缺陷检测基线。
#
# 字段说明：
#   __include__：递归继承木材数据集配置；因此训练/验证图片、COCO JSON、增强、
#                960x960 输入、总 batch、训练轮数和 optimizer 均不在本文件重复改写。
#   output_dir：本实验 checkpoint、日志和评估中间结果的独立目录。
#   HybridEncoder.use_crossmamba=false：不创建 CrossMamba 模块，作为 R1-R4 的
#                公平结构基线；此时模型参数命名空间不会出现 crossmamba_p4。
__include__:
  - ../deim_hgnetv2_l_wood.yml

output_dir: ./deim_outputs/crossmamba_v2_r0_baseline

HybridEncoder:
  # 关闭时不会创建 crossmamba_p4，也不会新增任何 CrossMamba 参数。
  use_crossmamba: false

# 训练命令（在 /home/zxw4090/hjw/DEIM_Mamba 执行；不需要 -u 数据集覆盖）：
# CUDA_VISIBLE_DEVICES=0,2 torchrun --master_port=7790 --nproc_per_node=2 train.py \
#   -c configs/deim_dfine/crossmamba_v2/r0_baseline.yml \
#   -t /home/zxw4090/hjw/D-FINE/weight/deim_dfine_hgnetv2_l_coco_50e.pth \
#   --use-amp --seed=0
